<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Archivist's Vault</title>
    <link rel="icon" href="/impractical-series/bulb.png" type="image/png" />
    <script type="module" crossorigin src="/impractical-series/assets/archivist-Di3hRsgi.js"></script>
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="/impractical-series/assets/archivist-DM-Uk0_7.css">
  </head>
  <body>
    <header class="vault-header">
      <h1>The Archivist's Vault</h1>
      <div class="controls">
        <button id="stack-books" class="btn-vault">📚 Stack Books</button>
        <button id="reset-books" class="btn-vault">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            version="1.1"
            viewBox="0 0 16 16"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
          >
            <path
              d="m4.75 10.75h-3m12.5-2c0 3-2.79822 5.5-6.25 5.5-3.75 0-6.25-3.5-6.25-3.5v3.5m9.5-9h3m-12.5 2c0-3 2.79822-5.5 6.25-5.5 3.75 0 6.25 3.5 6.25 3.5v-3.5"
            />
          </svg>
          Refresh Vault
        </button>
      </div>
      <div id="progress-text" class="status">SECRETS FOUND: 0 / 3</div>
    </header>

    <main class="vault-scene">
      <div class="bookshelf-container" id="bookshelfContainer">
        <div class="shelf-back"></div>
        <div class="shelf-unit" id="shelf-unit"></div>
      </div>
    </main>
  </body>
</html>
