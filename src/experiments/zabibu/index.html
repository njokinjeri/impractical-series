<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zabibu | 3D Botanical Grape Cluster</title>
    <link rel="icon" href="/impractical-series/bulb.png" type="image/png" />
    <script type="module" crossorigin src="/impractical-series/assets/zabibu-C3p1a36o.js"></script>
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/modulepreload-polyfill-BdX5DvLD.js">
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/three.module-Dr297Cvp.js">
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/OrbitControls-v8NspH8y.js">
    <link rel="stylesheet" crossorigin href="/impractical-series/assets/zabibu-CxWPXpp8.css">
  </head>
  <body>
    <div id="loading">Drawing Botanical Anatomy & Physics...</div>
    <div class="paper-overlay"></div>
    <div id="canvas-container"></div>

    <header id="app-header">
      <h1>Zabibu</h1>
      <p>
        An interactive 3D botanical study exploring procedural grape clusters.
      </p>
    </header>

    <div id="ui-panel">
      <div class="ui-panel-header">
        <h2>Botanical Sketch Controls</h2>
        <button id="btn-collapse" class="icon-btn" aria-label="Toggle Panel">—</button>
      </div>

      <div id="ui-content">
        <div class="control-group">
          <label>Color Palette <span id="mode-val">Vibrant Red</span></label>
          <button class="btn" id="btn-toggle-color">Next Palette</button>
        </div>

        <div class="control-group">
          <label>Cross-Hatching Density <span id="hatch-val">3.0</span></label>
          <input
            type="range"
            id="slider-hatch"
            min="1.0"
            max="6.0"
            step="0.1"
            value="3.0"
          />
        </div>

        <div class="control-group">
          <label>Berry Bounciness <span id="bounce-val">0.55</span></label>
          <input
            type="range"
            id="slider-bounce"
            min="0.1"
            max="0.9"
            step="0.05"
            value="0.55"
          />
        </div>

        <div class="control-group" style="margin-top: 10px">
          <button class="btn" id="btn-reset">Rebuild Botanical Cluster</button>
        </div>
      </div>
    </div>

    <div id="instruction">
      🍇 Click any individual grape to sever its pedicel stem
    </div>

  </body>
</html>
