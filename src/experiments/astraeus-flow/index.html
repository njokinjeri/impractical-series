<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astraeus Flow</title>
    <link rel="icon" href="/impractical-series/bulb.png" type="image/png" />
    <script type="module" crossorigin src="/impractical-series/assets/astraeus-Q8FsVKib.js"></script>
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/modulepreload-polyfill-BdX5DvLD.js">
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/three.module-BqkxVUR3.js">
    <link rel="stylesheet" crossorigin href="/impractical-series/assets/astraeus-CCklSvzy.css">
  </head>
  <body>
    <main id="app-canvas-container">
      <canvas id="genesis-canvas"></canvas>
    </main>

    <aside id="control-panel">
      <button id="collapse-btn">◀</button>
      <h2>Astraeus Core</h2>
      <div class="monitor-line"></div>

      <div class="control-group">
        <label
          >Energy <span id="val-expansion" class="value-display"></span
        ></label>
        <input
          type="range"
          id="explosionForce"
          min="0.1"
          max="5.0"
          step="0.1"
          value="1.5"
        />
      </div>

      <div class="control-group">
        <label
          >Tension <span id="val-gravity" class="value-display"></span
        ></label>
        <input
          type="range"
          id="collapseSpeed"
          min="0.005"
          max="0.1"
          step="0.005"
          value="0.02"
        />
      </div>

      <div class="control-group">
        <label>Drift <span id="val-chaos" class="value-display"></span></label>
        <input
          type="range"
          id="noiseScale"
          min="0"
          max="0.5"
          step="0.01"
          value="0.05"
        />
      </div>
    </aside>

    <footer id="stats">
      <div class="stat-item">
        <span class="stat-label">System State</span>
        <span id="state" class="stat-value">STABLE</span>
      </div>
    </footer>

    <div id="instructions">Move mouse to disrupt the Particles</div>

  </body>
</html>
