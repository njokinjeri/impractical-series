<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/impractical-series/bulb.png" type="image/png" />
    <title>❤ Parametric Love</title>
    <script type="module" crossorigin src="/impractical-series/assets/parametric-BtsQaIz0.js"></script>
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/modulepreload-polyfill-BdX5DvLD.js">
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/vendor-three-DmPF0-Y0.js">
    <link rel="stylesheet" crossorigin href="/impractical-series/assets/parametric-C1HqDuwZ.css">
  </head>
  <body>
    <div id="control-panel">
      <button id="collapse-btn" title="Toggle controls">◀</button>
      <h2>❤ Parametric ❤</h2>

      <div class="control-group">
        <label>Color</label>
        <div class="color-grid" id="color-grid"></div>
      </div>

      <div class="control-group">
        <label
          >Size: <span class="value-display" id="size-value">100</span>%</label
        >
        <input
          type="range"
          id="size-slider"
          min="0.5"
          max="1.3"
          step="0.05"
          value="1"
        />
      </div>

      <div class="control-group">
        <label
          >Wireframe:
          <span class="value-display" id="wire-value">65</span>%</label
        >
        <input
          type="range"
          id="wire-slider"
          min="5"
          max="100"
          step="1"
          value="65"
        />
      </div>

      <div class="control-group">
        <label
          >Burst Count:
          <span class="value-display" id="burst-value">80</span></label
        >
        <input
          type="range"
          id="burst-slider"
          min="5"
          max="150"
          step="5"
          value="80"
        />
      </div>
    </div>

    <div id="stats">
      <div class="stat-item">
        <span class="stat-label">Hearts Created</span>
        <span class="stat-value" id="hearts-count">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Fill %</span>
        <span class="stat-value" id="fill-percent">0</span>
      </div>
    </div>

    <div id="fill-bar">
      <div id="fill-bar-inner"></div>
      <div id="fill-percent-text">0%</div>
    </div>

    <div id="instructions">Click heart to fill • Drag to rotate</div>
  </body>
</html>
