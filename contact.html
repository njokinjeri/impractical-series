<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch - Impractical Series." />
    <title>Contact - Impractical Series</title>
    <link rel="icon" type="image/png" href="/impractical-series/bulb.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script type="module" crossorigin src="/impractical-series/assets/contact-Bu2rqQwL.js"></script>
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/footer-mount-30YMGat2.js">
    <link rel="stylesheet" crossorigin href="/impractical-series/assets/footer-mount-B-859Icd.css">
  </head>
  <body>
    <header class="site-nav" role="banner">
      <a class="brand" href="/impractical-series/">impractical_</a>
      <nav aria-label="Site navigation">
        <a class="nav-pill" href="/impractical-series/about">about</a>
        <a
          class="nav-pill"
          href="/impractical-series/contact"
          data-active="true"
          style="--pill-accent: var(--color-amber)"
          >contact</a
        >
      </nav>
    </header>

    <main>
      <h1 class="page-title">got a crazy idea?</h1>
      <p class="page-desc">
        drop a line. thoughts, bugs, or side-project concepts.
      </p>

      <form id="contact-form" novalidate>
        <label class="sr-only" for="contact-name">Name</label>
        <input
          id="contact-name"
          class="field"
          type="text"
          placeholder="name"
          autocomplete="name"
        />

        <label class="sr-only" for="contact-email">Email</label>
        <input
          id="contact-email"
          class="field"
          type="email"
          placeholder="email"
          autocomplete="email"
        />

        <label class="sr-only" for="contact-idea">Your idea</label>
        <textarea
          id="contact-idea"
          class="field"
          rows="6"
          placeholder="describe an impractical project..."
        ></textarea>

        <button class="btn btn--primary" type="submit">send</button>
      </form>
    </main>
    <footer class="site-footer">
      <div class="footer-art" aria-hidden="true">
        <canvas id="footer-canvas"></canvas>
        <div class="footer-wordmark">
          <span class="footer-wordmark__main">IMPRACTICAL</span>
          <span class="footer-wordmark__sub">series</span>
        </div>
      </div>
      <div class="footer-bottom">
        <nav class="footer-socials" aria-label="Social links">
          <a
            href="https://github.com/njokinjeri"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Github repository"
          >
            <i class="fa-brands fa-github"></i>
          </a>
          <a
            href="https://linkedin.com/in/njokinjeri"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn Profile"
          >
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a href="mailto:njerinjoki33@gmail.com" aria-label="Send email">
            <i class="fa-solid fa-envelope"></i>
          </a>
        </nav>
        <div class="footer-credit">
          <p class="footer-text">
            curiously tinkered with
            <span
              class="footer-heart"
              id="footer-heart"
              aria-label="love"
              role="img"
            ></span>
          </p>
          <span class="footer-copyright">&copy; 2026</span>
        </div>
      </div>
    </footer>
  </body>
</html>
