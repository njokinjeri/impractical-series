<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Impractical Series: a growing collection of generative and interactive experiments built for the joy of building."
    />
    <link rel="bulb icon" type="image/png" href="/impractical-series/bulb.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Impractical Series</title>
    <script type="module" crossorigin src="/impractical-series/assets/main-t3cYglJ7.js"></script>
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/footer-mount-30YMGat2.js">
    <link rel="modulepreload" crossorigin href="/impractical-series/assets/projects-BSTU5Vh6.js">
    <link rel="stylesheet" crossorigin href="/impractical-series/assets/footer-mount-B-859Icd.css">
  </head>
  <body>
    <header class="site-nav">
      <a
        class="brand"
        href="/impractical-series/"
        aria-label="Impractical Series"
      >
        impractical_
      </a>
      <nav aria-label="Site navigation">
        <a class="nav-pill" href="/impractical-series/about">about</a>
        <a class="nav-pill" href="/impractical-series/contact">contact</a>
      </nav>
    </header>
    <main>
      <section class="hero" aria-label="Interactive physics sandbox">
        <canvas id="hero-canvas" aria-hidden="true"></canvas>
        <p class="hero-hint" aria-live="polite">drag a shape to interrupt</p>
      </section>

      <section class="projects" aria-labelledby="projects-heading">
        <div class="projects__header">
          <h2 id="projects-heading" class="projects__title">experiments</h2>
          <div
            class="filter-row"
            id="filter-row"
            role="group"
            aria-label="Filter by stack"
          >
            <button class="filter-pill filter-pill--active" data-filter="all">
              all
            </button>
            <button class="filter-pill" data-filter="canvas">canvas</button>
            <button class="filter-pill" data-filter="three">three.js</button>
            <button class="filter-pill" data-filter="css">css</button>
          </div>
        </div>

        <div class="card-grid" id="card-grid" role="list"></div>

        <nav class="pagination" aria-label="Project pagination">
          <button
            class="pagination__prev"
            id="page-prev"
            aria-label="Previous page"
          >
            previous
          </button>
          <span
            class="pagination__indicator"
            id="page-indicator"
            aria-live="polite"
            >1 of 1</span
          >
          <button
            class="pagination__next"
            id="page-next"
            aria-label="Next page"
          >
            next
          </button>
        </nav>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-art" aria-hidden="true">
        <canvas id="footer-canvas"></canvas>
        <div class="footer-wordmark">
          <span class="footer-wordmark__main">IMPRACTICAL</span>
          <span class="footer-wordmark__sub">series</span>
        </div>
      </div>
      <div class="footer-bottom">
        <nav class="footer-socials" aria-label="Social links">
          <a
            href="https://github.com/njokinjeri"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Github repository"
          >
            <i class="fa-brands fa-github"></i>
          </a>
          <a
            href="https://linkedin.com/in/njokinjeri"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn Profile"
          >
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a href="mailto:njerinjoki33@gmail.com" aria-label="Send email">
            <i class="fa-solid fa-envelope"></i>
          </a>
        </nav>
        <div class="footer-credit">
          <p class="footer-text">
            curiously tinkered with
            <span
              class="footer-heart"
              id="footer-heart"
              aria-label="love"
              role="img"
            ></span>
          </p>
          <span class="footer-copyright">&copy; 2026</span>
        </div>
      </div>
    </footer>
  </body>
</html>
